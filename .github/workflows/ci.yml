name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  SKIP_PLC_TESTS: '1'

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
        include:
          - os: ubuntu-latest
            rust: stable
            coverage: true

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --workspace --all-features --locked --verbose

    - name: Build release cdylib for C# tests
      run: cargo build --release --workspace --all-features --locked

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Run C# tests
      run: dotnet test csharp/RustEtherNetIp.Tests/RustEtherNetIp.Tests.csproj -c Release

    - name: Install cargo-tarpaulin
      if: matrix.coverage
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin

    - name: Generate code coverage
      if: matrix.coverage
      run: cargo tarpaulin --workspace --all-features --out Xml --out Html

    - name: Upload coverage to Codecov
      if: matrix.coverage
      uses: codecov/codecov-action@v5
      with:
        files: ./cobertura.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  python:
    name: Python (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: python

    - name: Build native library (release, with ffi)
      run: cargo build --release --features ffi --locked

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Install Python wrapper
      working-directory: python
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Compile-check Python sources
      working-directory: python
      run: python -m compileall -q rust_ethernet_ip tests

    - name: Run Python tests
      working-directory: python
      env:
        RUST_ETHERNET_IP_START_SIM: '1'
      run: python -m unittest discover -v tests

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.95.0
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: msrv
    - name: Check workspace builds on MSRV
      run: cargo check --workspace --all-features --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    - run: cargo audit

  semver-checks:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: semver
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-semver-checks
    - name: Check public API against crates.io 0.7.0
      run: cargo semver-checks check-release --baseline-version 0.7.0

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify version consistency across manifests
      run: python .github/scripts/check_versions.py

  validate-agent-files:
    name: validate-agent-files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate agent task files
      run: scripts/validate-agent-files
    - name: Run validator smoke tests
      run: tests/validate_agent_files_tests.sh

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Check release readiness for current version
      run: |
        VERSION=$(sed -n '0,/^version = "\([^"]*\)"/s//\1/p' Cargo.toml)
        scripts/check-release-readiness "$VERSION"

  agent-commit-tests:
    name: agent-commit-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run agent commit wrapper tests
      run: tests/agent_commit_tests.sh

  package:
    name: Package validation
    needs: [test, python]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: package

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: cargo package (validates publishable crate)
      run: cargo package --locked

    - name: Build release cdylib (NuGet bundles it)
      run: cargo build --release --features ffi --locked

    - name: dotnet pack
      run: dotnet pack csharp/RustEtherNetIp/RustEtherNetIp.csproj -c Release -o dist-nuget

    - name: python -m build + wheel install smoke test
      working-directory: python
      run: |
        python -m pip install --upgrade pip build
        python -m build
        pip install dist/*.whl
        python -c "import rust_ethernet_ip; print('imported', rust_ethernet_ip.__name__)"

  build:
    name: Build
    needs: [test, python, msrv, audit, semver-checks, package, version-check, validate-agent-files, release-readiness, agent-commit-tests]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: build

    - name: Build Rust library
      run: cargo build --release --features ffi --locked

    - name: Setup .NET
      if: matrix.os == 'ubuntu-latest'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Build C# library
      if: matrix.os == 'ubuntu-latest'
      run: dotnet build csharp/RustEtherNetIp/RustEtherNetIp.csproj -c Release

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-build
        path: |
          target/release/librust_ethernet_ip.*
          target/release/rust_ethernet_ip.dll
          csharp/RustEtherNetIp/bin/Release/
