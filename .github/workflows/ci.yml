name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 9 * * 1'

env:
  CARGO_TERM_COLOR: always
  SKIP_PLC_TESTS: '1'

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
        include:
          - os: ubuntu-latest
            rust: stable
            coverage: true

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --workspace --all-features --locked --verbose

    # The C# wrapper consumes the stable C ABI, so a stable-toolchain-built
    # cdylib is sufficient. The Rust side is already covered by `cargo test`
    # on beta. See
    # wiki/investigations/dotnet-testhost-shutdown-2026-05-26.md.
    - name: Build release cdylib (ffi) for C# tests
      if: matrix.rust == 'stable'
      shell: bash
      run: |
        # Remove any cached/stale cdylib, then build the exact native image that
        # MSBuild will stage before testhost starts.
        rm -f target/release/librust_ethernet_ip.so \
              target/release/librust_ethernet_ip.dylib \
              target/release/rust_ethernet_ip.dll
        cargo build --release --features ffi --locked

    - name: Setup .NET
      if: matrix.rust == 'stable'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run C# tests
      if: matrix.rust == 'stable'
      shell: bash
      run: |
        dotnet test csharp/RustEtherNetIp.Tests/RustEtherNetIp.Tests.csproj -c Release --blame-crash

    - name: Run C# native P/Invoke integration tests
      if: matrix.rust == 'stable'
      shell: bash
      run: |
        dotnet test csharp/RustEtherNetIp.IntegrationTests/RustEtherNetIp.IntegrationTests.csproj -c Release --blame-crash

    # Preserve --blame-crash evidence for any future native-process failure.
    - name: Upload C# testhost crash dumps
      if: matrix.rust == 'stable' && always()
      uses: actions/upload-artifact@v4
      with:
        name: csharp-testhost-dumps-${{ matrix.os }}-${{ github.run_id }}
        path: |
          csharp/**/TestResults/**/*crashdump*.dmp
          csharp/**/TestResults/**/Sequence_*.xml
        if-no-files-found: ignore
        retention-days: 14

    - name: Install cargo-tarpaulin
      if: matrix.coverage
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin

    - name: Generate code coverage
      if: matrix.coverage
      run: cargo tarpaulin --workspace --all-features --out Xml --out Html

    - name: Upload coverage to Codecov
      if: matrix.coverage
      uses: codecov/codecov-action@v5
      with:
        files: ./cobertura.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  python:
    name: Python (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: python

    - name: Build native library (release, with ffi)
      run: cargo build --release --features ffi --locked

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Install Python wrapper
      working-directory: python
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Compile-check Python sources
      working-directory: python
      run: python -m compileall -q rust_ethernet_ip tests

    - name: Run Python tests
      working-directory: python
      env:
        RUST_ETHERNET_IP_START_SIM: '1'
      run: python -m unittest discover -v tests

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Read MSRV from workspace manifest
      id: msrv
      shell: bash
      run: |
        msrv="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
        test -n "$msrv"
        echo "version=$msrv" >> "$GITHUB_OUTPUT"
    - name: Install MSRV toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.msrv.outputs.version }}
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: msrv
    - name: Test workspace on MSRV
      run: cargo test --workspace --all-features --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    - run: cargo audit

  semver-checks:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: semver
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-semver-checks
    - name: Check public API against crates.io 1.1.0
      run: cargo semver-checks check-release --baseline-version 1.1.0

  cpp:
    name: C++ header/example (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: cpp
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build native library (release, with ffi)
      shell: bash
      run: cargo build --release --features ffi --locked
    - name: Resolve native library path
      shell: bash
      run: |
        case "${{ runner.os }}" in
          Windows) f="$GITHUB_WORKSPACE/target/release/rust_ethernet_ip.dll";;
          macOS)   f="$GITHUB_WORKSPACE/target/release/librust_ethernet_ip.dylib";;
          *)       f="$GITHUB_WORKSPACE/target/release/librust_ethernet_ip.so";;
        esac
        echo "RUST_ETHERNET_IP_NATIVE_LIB=$f" >> "$GITHUB_ENV"
    - name: Check C header/export parity
      shell: bash
      run: python scripts/check-ffi-header-parity.py --library "$RUST_ETHERNET_IP_NATIVE_LIB"
    - name: Configure C++ example
      shell: bash
      run: cmake -S examples/cpp -B target/cpp -DRUST_ETHERNET_IP_NATIVE_LIB="$RUST_ETHERNET_IP_NATIVE_LIB"
    - name: Build C++ example
      shell: bash
      run: cmake --build target/cpp --config Release
    - name: Run C++ smoke
      shell: bash
      run: ctest --test-dir target/cpp --output-on-failure -C Release

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify version consistency across manifests
      run: python .github/scripts/check_versions.py

  validate-agent-files:
    name: validate-agent-files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate agent task files
      run: scripts/validate-agent-files
    - name: Run validator smoke tests
      run: tests/validate_agent_files_tests.sh

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Check release readiness for current version
      run: |
        VERSION=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
        scripts/check-release-readiness "$VERSION" --development
    - name: Run release-readiness script tests
      run: tests/release_readiness_tests.sh

  agent-commit-tests:
    name: agent-commit-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run agent commit wrapper tests
      run: tests/agent_commit_tests.sh

  full-coverage-manifest:
    name: Full coverage manifest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build native library (release, with ffi)
      run: cargo build --release --features ffi --locked
    - name: Validate manifest schema and counts
      run: tests/full_coverage_manifest_tests.sh
    - name: Rust dry run
      run: cargo run --example test_plc_full_coverage --locked -- --dry-run
    - name: C# dry run
      run: dotnet run --project examples/CSharpFullCoverage/CSharpFullCoverage.csproj -c Release -- --dry-run
    - name: Python dry run
      run: PYTHONPATH=python python3 python/examples/test_plc_full_coverage.py --dry-run

  package:
    name: Package validation
    # Rust tarball readiness is validated by the dependency-order-aware job.
    # On an unpublished development line, a raw root `cargo package` cannot
    # resolve same-version sibling crates until they appear on crates.io.
    needs: [test, python, release-readiness]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: package

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build release cdylib (NuGet bundles it)
      run: cargo build --release --features ffi --locked

    - name: dotnet pack
      run: dotnet pack csharp/RustEtherNetIp/RustEtherNetIp.csproj -c Release -o dist-nuget

    - name: python -m build + wheel install smoke test
      working-directory: python
      run: |
        python -m pip install --upgrade pip build
        python -m build
        pip install dist/*.whl
        python -c "import rust_ethernet_ip; print('imported', rust_ethernet_ip.__name__)"

  build:
    name: Build
    needs: [test, python, msrv, audit, semver-checks, cpp, package, version-check, validate-agent-files, release-readiness, agent-commit-tests, full-coverage-manifest]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: build

    - name: Build Rust library
      run: cargo build --release --features ffi --locked

    - name: Setup .NET
      if: matrix.os == 'ubuntu-latest'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build C# library
      if: matrix.os == 'ubuntu-latest'
      run: dotnet build csharp/RustEtherNetIp/RustEtherNetIp.csproj -c Release

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-build
        path: |
          target/release/librust_ethernet_ip.*
          target/release/rust_ethernet_ip.dll
          csharp/RustEtherNetIp/bin/Release/
