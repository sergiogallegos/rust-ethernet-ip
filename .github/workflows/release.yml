name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1) Build the native cdylib on every supported platform/RID and upload each
  #    as an artifact for the NuGet (multi-RID) and PyPI (wheel) packaging jobs.
  build-native:
    name: Build native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    # Safety net: GitHub's macOS Intel (macos-13) free runners can queue for a
    # very long time. Cap each native build so a stuck runner can't block the
    # whole release indefinitely.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib: librust_ethernet_ip.so
          - os: windows-latest
            rid: win-x64
            lib: rust_ethernet_ip.dll
          - os: macos-14
            rid: osx-arm64
            lib: librust_ethernet_ip.dylib
    # Note: osx-x64 (Intel Mac) is intentionally omitted — the macos-13 free
    # runner is unreliable. Apple Silicon (osx-arm64) covers modern Macs; Intel
    # Mac consumers can build from source. Re-add a macos-13 entry here if a
    # reliable Intel runner becomes available.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build cdylib
        run: cargo build --release --features ffi --locked
      - name: Stage native library
        shell: bash
        run: |
          mkdir -p "staging/${{ matrix.rid }}"
          cp "target/release/${{ matrix.lib }}" "staging/${{ matrix.rid }}/${{ matrix.lib }}"
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: staging/${{ matrix.rid }}/*

  # 2) Assemble a single multi-RID NuGet package from the per-platform natives.
  nuget:
    name: NuGet (multi-RID)
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: runtimes
      - name: Pack multi-RID NuGet package
        shell: pwsh
        run: |
          # download-artifact lays out runtimes/native-<rid>/<lib>; normalize to
          # runtimes/<rid>/<lib> for pack-nuget.ps1 -RuntimesDir.
          Get-ChildItem -Path runtimes -Directory | ForEach-Object {
            $rid = $_.Name -replace '^native-', ''
            if ($rid -ne $_.Name) { Rename-Item $_.FullName (Join-Path $_.Parent.FullName $rid) }
          }
          # The wrapper csproj copies target/release/<native> during its build,
          # but this runner never built the cdylib (it downloaded artifacts), so
          # place the Linux native there to satisfy the build-time copy.
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          Copy-Item runtimes/linux-x64/librust_ethernet_ip.so target/release/librust_ethernet_ip.so -Force
          ./scripts/pack-nuget.ps1 -OutputDir ./artifacts/nuget -RuntimesDir ./runtimes
      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg
      - name: Publish to NuGet
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && env.NUGET_API_KEY != ''
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path artifacts/nuget -Filter *.nupkg |
            Where-Object { $_.Name -notlike "*.symbols.nupkg" } |
            Select-Object -First 1
          if ($null -eq $package) { throw "No NuGet package found" }
          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source "https://api.nuget.org/v3/index.json" --skip-duplicate

  # 3) Publish the five crates to crates.io in dependency order. Gated on the
  #    CARGO_REGISTRY_TOKEN secret; no-ops if it is not configured.
  crates-io:
    name: Publish crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates in dependency order
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          set -euo pipefail
          for crate in \
            rust-ethernet-ip-types \
            rust-ethernet-ip-tag-path \
            rust-ethernet-ip-protocol \
            rust-ethernet-ip-udt \
            rust-ethernet-ip; do
            echo "::group::publish $crate"
            # Tolerate an already-published version so re-runs are idempotent.
            publish_log="$(mktemp)"
            set +e
            cargo publish -p "$crate" 2>&1 | tee "$publish_log"
            status="${PIPESTATUS[0]}"
            set -e
            if [[ "$status" -eq 0 ]]; then
              rm -f "$publish_log"
            elif grep -Eiq 'already (uploaded|exists)|previously uploaded' "$publish_log"; then
              echo "publish of $crate skipped because this version already exists"
              rm -f "$publish_log"
            else
              rm -f "$publish_log"
              exit "$status"
            fi
            echo "::endgroup::"
            # Give the index time to propagate before the dependent crate builds.
            sleep 60
          done
      - name: Skip notice
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish."

  # 4) Build platform wheels (with the native lib bundled), then publish to PyPI.
  pypi-wheels:
    name: Build wheel (${{ matrix.rid }})
    needs: build-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows/macOS wheels build here on their native runners. The Linux
        # wheel must be manylinux-tagged (PyPI rejects raw linux_x86_64), so it
        # is built separately in the `pypi-linux-wheel` job below inside a
        # manylinux container.
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-14
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download native for this RID
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: native
      - name: Stage native lib into the package
        shell: bash
        run: cp native/* python/rust_ethernet_ip/
      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          cd python
          python -m build --wheel
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.rid }}
          path: python/dist/*.whl

  # Linux wheel: build the cdylib AND the wheel inside a manylinux container so
  # the .so links an old, portable glibc, then auditwheel-repair to a
  # manylinux_* tag that PyPI accepts.
  pypi-linux-wheel:
    name: Build wheel (manylinux x86_64)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - name: Build cdylib (ffi) against manylinux glibc
        run: |
          source "$HOME/.cargo/env"
          cargo build --release --features ffi --locked
      - name: Stage native lib and build wheel
        run: |
          PY=/opt/python/cp312-cp312/bin/python
          "$PY" python/scripts/stage_native_lib.py --profile release
          "$PY" -m pip install --upgrade build
          ( cd python && "$PY" -m build --wheel )
      - name: Repair to manylinux
        run: |
          mkdir -p python/wheelhouse
          for whl in python/dist/*linux_x86_64.whl; do
            auditwheel repair "$whl" -w python/wheelhouse/
          done
          ls -l python/wheelhouse
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x64
          path: python/wheelhouse/*.whl

  # Blocking gate: install the repaired Linux wheel in a clean (non-manylinux)
  # container and confirm the package imports and the native library loads.
  pypi-linux-smoke:
    name: Smoke-test manylinux wheel
    needs: pypi-linux-wheel
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x64
          path: dist
      - name: Verify manylinux tag, install, and import
        run: |
          ls -l dist
          ls dist/*.whl | grep -E 'manylinux.*x86_64' \
            || { echo "ERROR: Linux wheel is not manylinux-tagged"; exit 1; }
          pip install dist/*.whl
          python - <<'PY'
          from rust_ethernet_ip import bindings
          lib = bindings.load_native_library()
          print("manylinux wheel OK: native lib loaded, ABI", bindings.ABI_VERSION)
          PY

  pypi-publish:
    name: Publish PyPI
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [pypi-wheels, pypi-linux-smoke]
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          cd python
          python -m build --sdist
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist-wheels
          merge-multiple: true
      - name: Collect distributions
        run: |
          mkdir -p dist
          cp python/dist/*.tar.gz dist/ || true
          cp dist-wheels/*.whl dist/ || true
          ls -l dist
      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        run: |
          python -m pip install --upgrade twine
          twine upload --skip-existing -u __token__ -p "$PYPI_API_TOKEN" dist/*
      - name: Skip notice
        if: env.PYPI_API_TOKEN == ''
        run: echo "PYPI_API_TOKEN not set; skipping PyPI publish."
