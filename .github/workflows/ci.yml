name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
        include:
          - os: ubuntu-latest
            rust: stable
            coverage: true

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        override: true
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy -- -D warnings

    - name: Run tests
      run: cargo test --verbose

    - name: Run C# tests
      if: matrix.os == 'ubuntu-latest'
      run: |
        dotnet test csharp/RustEtherNetIp.Tests/RustEtherNetIp.Tests.csproj

    - name: Install cargo-tarpaulin
      if: matrix.coverage
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin

    - name: Generate code coverage
      if: matrix.coverage
      run: cargo tarpaulin --out Xml --out Html

    - name: Upload coverage to Codecov
      if: matrix.coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./cobertura.xml
        fail_ci_if_error: true

  build:
    name: Build
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Build Rust library
      run: cargo build --release --features ffi

    - name: Build C# library
      if: matrix.os == 'ubuntu-latest'
      run: |
        dotnet build csharp/RustEtherNetIp/RustEtherNetIp.csproj -c Release

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.os }}-build
        path: |
          target/release/librust_ethernet_ip.*
          csharp/RustEtherNetIp/bin/Release/
