[package]
name = "rust-ethernet-ip-udt"
version = "1.2.0"
edition = "2024"
license = "MIT"
description = "Logix UDT parsing helpers used by rust-ethernet-ip"
readme = "README.md"
repository = "https://github.com/sergiogallegos/rust-ethernet-ip"
homepage = "https://github.com/sergiogallegos/rust-ethernet-ip"
documentation = "https://docs.rs/rust-ethernet-ip-udt"
keywords = ["ethernet-ip", "plc", "allen-bradley", "logix", "udt"]
categories = ["data-structures", "network-programming"]
rust-version = "1.96"

[lib]
name = "rust_ethernet_ip_udt"
path = "src/lib.rs"

[dependencies]
rust-ethernet-ip-types = { path = "../types", version = "1.2.0" }

[dev-dependencies]
tracing = "0.1"
