[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rust-ethernet-ip"
version = "1.1.0"
description = "Thin Python wrapper for the rust-ethernet-ip native library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Sergio Gallegos" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sergiogallegos/rust-ethernet-ip"
Repository = "https://github.com/sergiogallegos/rust-ethernet-ip"
Issues = "https://github.com/sergiogallegos/rust-ethernet-ip/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
analytics = ["pandas>=2.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
mqtt = ["paho-mqtt>=2.1"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["rust_ethernet_ip*"]

# The native library (built by cargo and staged into the package by
# scripts/stage_native_lib.py) ships inside the wheel so a plain
# `pip install` works without a source checkout.
[tool.setuptools.package-data]
rust_ethernet_ip = ["*.so", "*.dll", "*.dylib", "_native/*"]
