name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  nuget-windows:
    name: NuGet Windows Package
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Windows native library
        run: cargo build --release

      - name: Pack NuGet package
        shell: pwsh
        run: ./scripts/pack-nuget.ps1 -OutputDir ./artifacts/nuget

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-windows-package
          path: artifacts/nuget/*.nupkg

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v') && env.NUGET_API_KEY != ''
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $package = Get-ChildItem -Path artifacts/nuget -Filter *.nupkg |
            Where-Object { $_.Name -notlike "*.symbols.nupkg" } |
            Select-Object -First 1

          if ($null -eq $package) {
            throw "No NuGet package found in artifacts/nuget"
          }

          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source "https://api.nuget.org/v3/index.json" --skip-duplicate
