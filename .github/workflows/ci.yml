name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  SKIP_PLC_TESTS: '1'

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
        include:
          - os: ubuntu-latest
            rust: stable
            coverage: true

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --workspace --all-features --locked --verbose

    - name: Build release cdylib for C# tests
      run: cargo build --release --workspace --all-features --locked

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Run C# tests
      run: dotnet test csharp/RustEtherNetIp.Tests/RustEtherNetIp.Tests.csproj -c Release

    - name: Install cargo-tarpaulin
      if: matrix.coverage
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin

    - name: Generate code coverage
      if: matrix.coverage
      run: cargo tarpaulin --workspace --all-features --out Xml --out Html

    - name: Upload coverage to Codecov
      if: matrix.coverage
      uses: codecov/codecov-action@v5
      with:
        files: ./cobertura.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  python:
    name: Python (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: python

    - name: Build native library (release, with ffi)
      run: cargo build --release --features ffi --locked

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Install Python wrapper
      working-directory: python
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run Python tests
      working-directory: python
      env:
        RUST_ETHERNET_IP_START_SIM: '1'
      run: python -m unittest discover -v tests

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.95.0
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: msrv
    - name: Check workspace builds on MSRV
      run: cargo check --workspace --all-features --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    - run: cargo audit

  build:
    name: Build
    needs: [test, python]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: build

    - name: Build Rust library
      run: cargo build --release --features ffi --locked

    - name: Setup .NET
      if: matrix.os == 'ubuntu-latest'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Build C# library
      if: matrix.os == 'ubuntu-latest'
      run: dotnet build csharp/RustEtherNetIp/RustEtherNetIp.csproj -c Release

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-build
        path: |
          target/release/librust_ethernet_ip.*
          target/release/rust_ethernet_ip.dll
          csharp/RustEtherNetIp/bin/Release/
