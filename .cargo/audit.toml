# cargo-audit advisory configuration
#
# Every ignored advisory below reaches the build only through
# `examples/desktop_app` — the GUI example crate that depends on eframe 0.27
# and its accesskit/wgpu/zbus/winit transitives. None of them affect the main
# `rust-ethernet-ip` library, the FFI cdylib, or the C# / Python wrappers.
#
# The first four are maintenance flags (unmaintained or minor unsoundness in
# custom-logger code paths). The two 2026 quick-xml entries are real DoS
# advisories, but the vulnerable parse (`NsReader` on attacker-controlled XML)
# is only reachable via `wayland-scanner`, which parses local Wayland protocol
# XML at build time of the Linux desktop example — no untrusted input path.
# A targeted `cargo update --precise quick-xml@0.41.0` was attempted 2026-07-02
# and rejected by the resolver: wayland-scanner 0.31.8 (← smithay-client-toolkit
# ← winit 0.29 ← eframe 0.27) pins quick-xml below 0.41.
#
# Lifting these requires an eframe upgrade in the example, which is tracked
# separately (ROADMAP). Ignoring here lets the security advisory job stay green
# so it can still fail loudly on advisories that actually affect the main crate.

[advisories]
ignore = [
    "RUSTSEC-2024-0388",  # derivative unmaintained — via desktop_app → eframe → accesskit_unix → atspi → zbus
    "RUSTSEC-2024-0384",  # instant unmaintained — via desktop_app → eframe → accesskit_unix → fastrand/futures-lite
    "RUSTSEC-2024-0436",  # paste unmaintained — via desktop_app → eframe → wgpu/accesskit_windows
    "RUSTSEC-2026-0097",  # rand unsoundness with custom logger — via desktop_app → eframe → accesskit_unix → zbus
    "RUSTSEC-2026-0194",  # quick-xml NsReader DoS — build-time-only via desktop_app → eframe → winit → sctk → wayland-scanner
    "RUSTSEC-2026-0195",  # quick-xml NsReader DoS (same crate, second advisory) — same build-time-only path
]
