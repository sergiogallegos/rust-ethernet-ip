[package]
name = "rust-ethernet-ip-tag-path"
version = "1.2.0"
edition = "2024"
license = "MIT"
description = "Allen-Bradley Logix tag-path parser used by rust-ethernet-ip"
readme = "README.md"
repository = "https://github.com/sergiogallegos/rust-ethernet-ip"
homepage = "https://github.com/sergiogallegos/rust-ethernet-ip"
documentation = "https://docs.rs/rust-ethernet-ip-tag-path"
keywords = ["ethernet-ip", "plc", "allen-bradley", "logix", "parser"]
categories = ["parser-implementations", "network-programming"]
rust-version = "1.96"

[lib]
name = "rust_ethernet_ip_tag_path"
path = "src/lib.rs"

[dev-dependencies]
tracing = "0.1"
