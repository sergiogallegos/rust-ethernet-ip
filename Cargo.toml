[workspace]
members = [
    ".",  # Main library (current directory)
    "crates/protocol",
    "crates/tag-path",
    "crates/types",
    "crates/udt",
    "examples/desktop_app"  # Desktop application
]

[package]
name = "rust-ethernet-ip"
version = "1.1.0"
edition = "2024"
description = "High-performance EtherNet/IP communication library for Allen-Bradley CompactLogix and ControlLogix PLCs"
license = "MIT"
repository = "https://github.com/sergiogallegos/rust-ethernet-ip"
homepage = "https://github.com/sergiogallegos/rust-ethernet-ip"
documentation = "https://docs.rs/rust_ethernet_ip"
readme = "README.md"
keywords = ["ethernet-ip", "plc", "industrial", "automation", "allen-bradley"]
categories = ["network-programming", "embedded", "api-bindings"]
rust-version = "1.96"

# Publish only the Rust crate payload needed by consumers.
include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "build.rs",
    "VERSION",
]

[lib]
name = "rust_ethernet_ip"
crate-type = ["rlib", "cdylib"]

[[bench]]
name = "performance_benchmark"
harness = false

[[bench]]
name = "udt_discovery_benchmark"
harness = false

[dependencies]
tokio = { version = "1.0", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "io-util",
] }
libc = { version = "0.2", optional = true }
bytes = "1.0"
thiserror = "2.0"
futures = { version = "0.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.0"
rust-ethernet-ip-tag-path = { path = "crates/tag-path", version = "1.1.0" }
rust-ethernet-ip-types = { path = "crates/types", version = "1.1.0" }
rust-ethernet-ip-protocol = { path = "crates/protocol", version = "1.1.0" }
rust-ethernet-ip-udt = { path = "crates/udt", version = "1.1.0" }

[dev-dependencies]
tokio-test = "0.4"
futures-util = "0.3"
criterion = "0.5"

[features]
default = []
ffi = ["dep:libc"]  # Enable C FFI exports

[build-dependencies]
vergen = { version = "8.3", features = ["build", "git", "gitcl"] }
